  <rect x="7" y="25" width="14" height="14" fill="#00A2BD" />
  <text
    x="26"
    y="45"
    font-family="Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#172125"
  >an</text>
</svg>
